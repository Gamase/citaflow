<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Antes de cualquier recurso externo (fuentes, botón de Google, la API): a otro sitio solo
         viaja el origen, nunca la ruta ni el ?token= de /verificar y /restablecer (que además se
         quita de la URL al abrirla). No "no-referrer": el botón de Google valida el origen. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E2A3B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CitaFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

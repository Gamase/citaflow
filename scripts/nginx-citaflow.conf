# Nginx de Producción (EC2): un solo dominio para el front y la API.
#
#   https://citaflow.familiamtz.com/        → el build del client (SPA) en /var/www/html
#   https://citaflow.familiamtz.com/api/... → la API (PM2) en 127.0.0.1:3000, sin el /api
#
# Se instala como /etc/nginx/sites-available/citaflow (enlace en sites-enabled). Este archivo
# es la versión solo HTTP: certbot (`sudo certbot --nginx -d citaflow.familiamtz.com`) le
# agrega el bloque 443 con el certificado y la redirección de HTTP a HTTPS en la copia de /etc.
#
# TRUST_PROXY=1 en server/.env: Nginx es el único proxy delante de la API (Cloudflare va en
# "solo DNS"). Nginx pone la IP real del cliente en X-Forwarded-For y descarta la que mande el
# cliente, así nadie falsea su IP para saltarse el rate limit.

server {
    listen 80;
    listen [::]:80;
    server_name citaflow.familiamtz.com;

    root /var/www/html;
    index index.html;

    # Ningún body de la API pasa de unos KB (las notas del cliente, el máximo, son 2000 caracteres).
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La API. La barra final en proxy_pass quita el /api: /api/auth/login → /auth/login.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos del build con hash en el nombre: se pueden guardar en caché para siempre.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Todo lo demás es la SPA: React Router resuelve /dashboard, /reservar/<slug>, etc.
    # index.html sin caché, para que un deploy nuevo se vea al recargar.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
